syntax = "proto3";

package monium.api.v4;

option go_package = "github.com/monium/api/v4";
option java_multiple_files = true;
option java_outer_classname = "ChartYAxisPositionProto";
option java_package = "monium.api.v4";

enum ChartYAxisPosition {
  // Uses the left axis by default.
  CHART_Y_AXIS_POSITION_UNSPECIFIED = 0;

  CHART_Y_AXIS_POSITION_LEFT = 1;

  CHART_Y_AXIS_POSITION_RIGHT = 2;
}
