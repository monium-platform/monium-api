syntax = "proto3";

package monium.api.v4;

option go_package = "github.com/monium/api/v4";
option java_multiple_files = true;
option java_outer_classname = "ChartLineStyleProto";
option java_package = "monium.api.v4";

enum ChartLineStyle {
  CHART_LINE_STYLE_UNSPECIFIED = 0;

  CHART_LINE_STYLE_SOLID = 1;

  CHART_LINE_STYLE_DASH = 2;

  CHART_LINE_STYLE_DOTS = 3;
}
