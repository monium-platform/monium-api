syntax = "proto3";

package monium.api.v4;

option go_package = "github.com/monium/api/v4";
option java_multiple_files = true;
option java_outer_classname = "ResourceManagementProto";
option java_package = "monium.api.v4";

message ResourceManagement {
  string managed_by = 1;

  // Requires a valid URI.
  string managed_link = 2;
}
