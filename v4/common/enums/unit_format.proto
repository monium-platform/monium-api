  UNIT_FORMAT_UNIT_MESSAGES_PER_SECOND = 90;

  // Equals [UNIT_FORMAT_UNIT_VIRTUAL_CPU][UnitFormat.UNIT_FORMAT_UNIT_VIRTUAL_CPU].
  UNIT_FORMAT_UNIT_NANOCORE_CPU = 91;

  // Equals `1000` [nanocores][UnitFormat.UNIT_FORMAT_UNIT_NANOCORE_CPU].
  UNIT_FORMAT_UNIT_MICROCORE_CPU = 92;

  // Equals `1000` [microcores][UnitFormat.UNIT_FORMAT_UNIT_MICROCORE_CPU].
