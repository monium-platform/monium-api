  UNIT_FORMAT_UNIT_PERCENT_UNIT = 4;

  // Expresses values in nanoseconds (`ns`).
  UNIT_FORMAT_UNIT_NANOSECONDS = 5;

  // Expresses values in microseconds (`µs`).
  UNIT_FORMAT_UNIT_MICROSECONDS = 6;

  // Expresses values in milliseconds (`ms`).
  UNIT_FORMAT_UNIT_MILLISECONDS = 7;

  // Expresses values in seconds (`s`).
  UNIT_FORMAT_UNIT_SECONDS = 8;

  // Expresses values in minutes (`m`).
  UNIT_FORMAT_UNIT_MINUTES = 9;

  // Expresses values in hours (`h`).
  UNIT_FORMAT_UNIT_HOURS = 10;

  // Expresses values in days (`d`).
  UNIT_FORMAT_UNIT_DAYS = 11;

