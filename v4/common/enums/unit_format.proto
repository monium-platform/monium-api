  UNIT_FORMAT_UNIT_KIBIBYTES_PER_SECOND = 50;

  // Expresses values in mebibits per second (`MiBits/sec`).
  UNIT_FORMAT_UNIT_MEBIBITS_PER_SECOND = 51;

  // Expresses values in mebibytes per second (`MiB/sec`).
  UNIT_FORMAT_UNIT_MEBIBYTES_PER_SECOND = 52;

  // Expresses values in gibibits per second (`GiBits/sec`).
  UNIT_FORMAT_UNIT_GIBIBITS_PER_SECOND = 53;

  // Expresses values in gibibytes per second (`GiB/sec`).
  UNIT_FORMAT_UNIT_GIBIBYTES_PER_SECOND = 54;

  // Expresses values in tebibits per second (`TiBits/sec`).
  UNIT_FORMAT_UNIT_TEBIBITS_PER_SECOND = 55;

