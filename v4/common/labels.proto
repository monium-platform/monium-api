syntax = "proto3";

package monium.api.v4;

option go_package = "github.com/monium/api/v4";
option java_multiple_files = true;
option java_outer_classname = "LabelsProto";
option java_package = "monium.api.v4";

// Contains parallel arrays of label keys and values.
message Labels {
  repeated string keys = 1;
  repeated string values = 2;
}
