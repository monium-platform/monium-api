syntax = "proto3";

package monium.api.v4;

import "v4/common/labels.proto";
import "v4/logs/enums/log_level.proto";

option go_package = "github.com/monium/api/v4";
option java_multiple_files = true;
option java_outer_classname = "LogEntryProto";
option java_package = "monium.api.v4";

// Represents a log entry returned by a search request.
message LogEntry {
  // Records the event time as nanoseconds since the Unix epoch.
  int64 time_unix_nano = 1;
  string project = 2;
  string service = 3;
  string cluster = 4;
  string message = 5;
  LogLevel level = 6;
  string trace_id = 7;
  string span_id = 8;
  // Uniquely identifies the log entry within a single search session. The value is generated by
  // the service and cannot be controlled by the user. The ID generation logic may change in the future.
  string log_id = 9;
  Labels labels = 10;
  Meta meta = 11;
}

// Contains parallel arrays of log metadata keys and values.
message Meta {
  repeated string keys = 1;
  repeated MetaValue values = 2;
}

message MetaValue {
  oneof kind {
    string string_value = 1;
  }
}
