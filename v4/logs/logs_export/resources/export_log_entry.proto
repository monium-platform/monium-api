syntax = "proto3";

package monium.api.v4;

import "v4/common/labels.proto";
import "v4/logs/common/meta.proto";
import "v4/logs/enums/log_level.proto";

option go_package = "github.com/monium/api/v4";
option java_multiple_files = true;
option java_outer_classname = "ExportLogEntryProto";
option java_package = "monium.api.v4";

message ExportLogEntry {
  int64 time_unix_nano = 1;
  string project = 2;
  string service = 3;
  string cluster = 4;
  string message = 5;
  LogLevel level = 6;
  string trace_id = 7;
  string span_id = 8;
  string log_id = 9;
  Labels labels = 10;
  Meta meta = 11;
}
